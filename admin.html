<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민석의 매일반찬 관리자</title>
</head>
<body>
<h1>민석의 매일반찬</h1>
<h2>관리자 페이지</h2>
<p>반찬 재고 관리</p>
<button>상품 추가</button>
<button>재고 수정</button>
<button>품절 처리</button>
<hr>
<h3>상품 등록</h3>
<p>상품 이름</p>
<input type="text" id="name" placeholder="반찬 이름">
<p>재고 수량</p>
<input type="number" id="stock" min="0" value="0">
<button disabled>등록하기</button>
</body>
</html>
